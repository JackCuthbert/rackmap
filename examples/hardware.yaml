groups:
  - id: home
    name: Home
    kind: location
  - id: office
    name: Office
    kind: room
    parent: home
  - id: office-rack
    name: Office rack
    kind: rack
    parent: office

hardware:
  - id: server-one
    name: Server One
    kind: compute
    group: office-rack
    capabilities: [virtualisation]
    hostname: server-one.home.example
    addresses: [{ address: 192.0.2.10, networkDevice: switch, vlanId: 2 }]
    manufacturer: Example Systems
    model: Rack 1U
    specs:
      cpu: 8 cores
      memory: 32 GiB
  - id: server-two
    name: Server Two
    kind: compute
    group: office-rack
    capabilities: [virtualisation]
    hostname: server-two.home.example
    addresses: [{ address: 192.0.2.11, networkDevice: switch, vlanId: 2 }]
    specs:
      cpu: 12 cores
      memory: 64 GiB
  - id: nas
    name: NAS
    kind: storage
    group: office-rack
  - id: ups
    name: UPS
    kind: ups
    group: office-rack
    connections:
      - target: server-one
        kind: usb
        label: UPS monitoring
      - target: server-one
        kind: power
        label: UPS power
      - target: server-two
        kind: power
        label: UPS power
