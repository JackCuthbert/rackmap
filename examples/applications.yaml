applications:
  - id: homepage
    name: Homepage
    kind: container
    runsOn: docker-01
    endpoints:
      - label: Homepage
        url: https://homepage.example
  - id: adguard
    name: AdGuard Home
    kind: container
    runsOn: docker-01
    domains: [adguard.home.example]
    endpoints:
      - label: DNS dashboard
        url: https://dns.example
  - id: monitoring
    name: Monitoring
    kind: service
    runsOn: docker-01
    dependsOn: [adguard]
  - id: beszel-agent
    name: Beszel agent
    kind: service
    runsOn: plex-vm
